{% extends "base.html" %}

{% block title %}{% if object %}Edit category{% else %}New category{% endif %}{% endblock %}

{% block content %}
  <h1>{% if object %}Edit {{ object.name }}{% else %}New category{% endif %}</h1>

  <form method="post">
    {% csrf_token %}
    <table>{{ form.as_table }}</table>
    <button type="submit">Save</button>
    <a href="{% url 'transactions:category_list' %}">Cancel</a>
  </form>
{% endblock %}
