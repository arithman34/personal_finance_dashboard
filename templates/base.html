<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{% endblock %}</title>
  </head>
  <body>
    <nav>
      {% if user.is_authenticated %}
      <a href="{% url 'transactions:transaction_list' %}">Transactions</a>
      <a href="{% url 'transactions:upload' %}">Upload statement</a>
      <a href="{% url 'transactions:dashboard' %}">Dashboard</a>
      <a href="{% url 'transactions:categorise' %}">Categorise</a>
      <a href="{% url 'transactions:category_list' %}">Categories</a>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Logout</button>
      </form>
      {% else %}
      <a href="{% url 'login' %}">Login</a>
      {% endif %}
    </nav>

    {% if messages %}
    <ul class="messages">
      {% for message in messages %}
      <li class="{{ message.tags }}">{{ message }}</li>
      {% endfor %}
    </ul>
    {% endif %} {% block content %}{% endblock %}
  </body>
</html>
